name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y luajit libluajit-5.1-dev shellcheck

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # fmt, clippy, workspace tests, the installer test, shellcheck
      - name: Check
        run: scripts/ci.sh

  pob-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y luajit libluajit-5.1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The key changes when the pinned PoB version in game.rs changes.
      - name: Cache upstream PoB
        id: pob-cache
        uses: actions/cache@v4
        with:
          path: ~/pob
          key: pob-${{ hashFiles('app/src/game.rs') }}

      - name: Fetch upstream PoB
        if: steps.pob-cache.outputs.cache-hit != 'true'
        run: cargo run -p auto-pob --example fetch_pob -- ~/pob

      # scripts/gate.sh unsets CI itself: GitHub sets CI=true, which makes upstream's
      # HeadlessWrapper skip ModCache and can change the golden values. -j2 suits the 2-core
      # 7 GB hosted runner (each test process can peak near 1 GB).
      - name: Gate tests
        run: AUTO_POB_POB_DIR=$HOME/pob scripts/gate.sh -j2
