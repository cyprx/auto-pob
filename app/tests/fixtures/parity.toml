# PoB 2.67.2 parity inventory (SP7 R2), checked by the gate test
# parity::parity_inventory_is_complete. Every control, popup and key upstream PoB has must have
# a row here, with exactly one of:
#   ported    = where the egui app offers the same function (a different widget is fine)
#   ruled_out = the R# (SP7 plan) or D-# (ledger) ruling that drops it
#   gap       = the task that closes it (Task 16 fails while any gap is left)
# plus an optional note. A widget's own scroll bars and +/-/x buttons share its status.
# NF-n rows are new findings from the Task 2 audit; the controller ruled all of them in scope.

