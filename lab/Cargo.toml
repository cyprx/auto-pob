[package]
name = "auto-pob-lab"
description = "Proof of concept: egui front-end driving Path of Building's calc engine headlessly"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata.release]
release = false

[dependencies]
anyhow = "1.0"
directories = "6.0.0"
eframe = "0.37"
egui_extras = "0.37"
flate2 = "1.1.2"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png", "webp"] }
luautf8-rs = { git = "https://github.com/meehl/luautf8-rs.git", rev = "dc74b734e5285108068cf2ffb674c1dc840073c1", features = ["luajit"] }
mlua = { version = "0.12.0", features = ["luajit"] }
