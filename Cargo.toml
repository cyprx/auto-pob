[package]
name = "rusty-path-of-building"
authors = ["meehl"]
description = "Cross-platform runtime for Path of Building"
repository = "https://github.com/meehl/rusty-path-of-building"
license = "MIT"
version = "0.3.3"
edition = "2024"
publish = false

[dependencies]
ahash = "0.8.12"
anyhow = "1.0"
arboard = { version = "3.6.1", default-features = false }
bytemuck = "1.23.2"
clap = { version = "4.5.46", features = ["derive"] }
dds = "0.2.0"
directories = "6.0.0"
env_logger = "0.11"
euclid = { version = "0.22.11", features = ["bytemuck"] }
fast_image_resize = { version = "6.0.0", features = ["image"] }
flate2 = "1.1.2"
glob = "0.3.3"
image = { version = "0.25.8", default-features = false, features = ["rayon", "jpeg", "png", "webp"] }
log = "0.4"
mlua = { version = "0.12.0", features = ["luajit", "anyhow"] }
nohash-hasher = "0.2.0"
num-traits = "0.2.19"
open = "5.3.2"
ordered-float = "5.0.0"
parley = { version = "0.12.0", default-features = false, features = ["std"] }
pollster = "1.0"
pob-runtime = { path = "crates/pob-runtime", default-features = false }
profiling = "1.0"
puffin_http = { version = "0.17", optional = true }
raw-window-handle = "0.6.2"
regex = "1.11.2"
reqwest = { version = "0.13.2", features = ["blocking"] }
swash = "0.2.5"
tar = "0.4.44"
wgpu = { version = "30.0.0", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "wgsl"] }
winit = "0.30"
zstd = "0.14"

[target.'cfg(target_os = "linux")'.dependencies]
smithay-clipboard = "0.7.3"

[features]
default = ["bundled-lua-modules"]
# Register Rust implementations of the Lua modules required by PoB's Lua code.
# Disable this to use the original C libraries.
bundled-lua-modules = ["pob-runtime/bundled-lua-modules"]
# Build LuaJIT from source instead of linking against a system installation.
vendored-lua = ["mlua/vendored"]
profile-with-puffin = ["profiling/profile-with-puffin", "dep:puffin_http"]

[workspace]
members = [".", "app", "crates/pob-runtime"]
default-members = ["app"]

[dev-dependencies]
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

# Inflating PoB's timeless jewel data (an Abyss type is 74 MB) takes about 2 s unoptimised: the
# gate and dev builds optimise flate2's backend, as the release build does
[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.adler2]
opt-level = 3

[profile.dev.package.simd-adler32]
opt-level = 3
