[package]
name = "auto-pob"
description = "egui front-end driving Path of Building's calc engine headlessly"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata.release]
release = false

[features]
# Build LuaJIT from source (release tarballs) instead of linking a system installation.
vendored-lua = ["mlua/vendored"]

[dependencies]
anyhow = "1.0"
arboard = { version = "3.6.1", default-features = false }
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
directories = "6.0.0"
eframe = "0.37"
# `experimental` makes egui's widget themes public: the edit boxes' hover look (theme.rs
# EditBoxStyle, the only user of that API). Keep the version identical to eframe's, or the
# build gets two eguis; the theme API is unstable, so check EditBoxStyle on every bump.
egui = { version = "0.37", features = ["experimental"] }
egui_extras = "0.37"
flate2 = "1.1.2"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png", "webp"] }
luautf8-rs = { git = "https://github.com/meehl/luautf8-rs.git", rev = "dc74b734e5285108068cf2ffb674c1dc840073c1", features = ["luajit"] }
mlua = { version = "0.12.0", features = ["luajit", "serde"] }
reqwest = { version = "0.13.2", features = ["blocking"] }
tar = "0.4.44"
# reads the default fonts to give the bytes PoB keeps that aren't UTF-8 their Windows-1252 glyphs
ttf-parser = "0.25.1"
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }
# egui-winit opens links with webbrowser; `hardened` lets it open http(s) URLs only (the
# Ctrl+click on a text box, R20 links)
webbrowser = { version = "1.2.6", features = ["hardened"] }
pob-runtime = { path = "../crates/pob-runtime" }
